name: Watch Conversations releases

# Opens an issue when Conversations publishes a release newer than the one this fork is based on.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare with latest upstream tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=$(sed -n "s/^ *versionName = '\([0-9.]*\)-cx.*/\1/p" build.gradle)
          latest=$(git ls-remote --tags --refs https://codeberg.org/iNPUTmice/Conversations.git \
            | sed 's#.*refs/tags/##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "based on: $base, latest upstream: $latest"
          if [ -z "$base" ] || [ -z "$latest" ]; then
            echo "could not determine versions"; exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$base" "$latest" | sort -V | tail -1)" = "$base" ]; then
            echo "up to date"; exit 0
          fi
          title="Merge Conversations $latest"
          if gh issue list --state all --search "\"$title\" in:title" --json title --jq '.[].title' | grep -qx "$title"; then
            echo "issue already exists"; exit 0
          fi
          gh issue create --title "$title" --body "Conversations $latest has been released (this fork is based on $base).

          Changelog: https://codeberg.org/iNPUTmice/Conversations/src/tag/$latest/CHANGELOG.md

          Steps: fetch the tag from upstream, merge it into \`chatrix\`, resolve conflicts, set the version to \`$latest-cx1\`, build, test on a phone, release."
