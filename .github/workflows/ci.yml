name: Build and test

on:
  push:
    branches: [chatrix]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testConversationsFreeDebugUnitTest

      - name: Build release (unsigned, includes lint vital checks)
        run: ./gradlew --no-daemon assembleConversationsFreeRelease

      - name: Upload unsigned APKs
        uses: actions/upload-artifact@v4
        with:
          name: chatrix-one-unsigned-apks
          path: build/outputs/apk/conversationsFree/release/*.apk
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 14
