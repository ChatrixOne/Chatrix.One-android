name: Build and test

on:
  push:
    branches: [chatrix]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to full commit hashes, not to tags that can be moved (the comment names the
# release). To update one, pin the commit of its new release tag.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before Gradle: after an upstream merge, a name in both our res/values*/chatrix*.xml and
      # upstream's files fails the build with "Duplicate resources"; this names each one and the fix.
      - name: Resource names shared with upstream
        run: python3 -I .github/scripts/check-resource-names.py

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Unit tests
        run: ./gradlew --no-daemon testConversationsFreeDebugUnitTest

      - name: Build release (unsigned, includes lint vital checks)
        run: ./gradlew --no-daemon assembleConversationsFreeRelease

      # Only our own pushes produce the APKs that get signed (notes/sign-ci-apks.sh): a pull request,
      # also one from a fork, is built and tested but leaves no APK artifact.
      - name: Upload unsigned APKs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chatrix-one-unsigned-apks
          path: build/outputs/apk/conversationsFree/release/*.apk
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 14
